name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # Ogni 3 giorni a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dal pannello GitHub Actions

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/classes?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
